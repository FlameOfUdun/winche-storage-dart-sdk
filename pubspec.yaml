  meta: ^1.16.0
  mime: ^2.0.0
  path: ^1.9.0
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  winche_core: ^0.2.0

dev_dependencies:
  test: ^1.24.0
  lints: ^4.0.0
